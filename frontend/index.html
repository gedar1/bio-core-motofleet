<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RYD Favorcitos</title>
    <link rel="icon" type="image/png" href="/src/assets/icons/favicon.ico" />
    <style>
      /* Evitar selección de texto al hacer scroll para mejorar UX */
      body {
        user-select: none;
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
      }

      /* Permitir selección en inputs y botones */
      input,
      textarea,
      button,
      a,
      [role="button"] {
        user-select: auto;
        -webkit-user-select: auto;
      }
    </style>
    <script>
      // Apply dark mode BEFORE first paint to prevent flash
      const theme = localStorage.getItem("theme");
      if (
        theme === "dark" ||
        (!theme && window.matchMedia("(prefers-color-scheme: dark)").matches)
      ) {
        document.documentElement.classList.add("dark");
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
